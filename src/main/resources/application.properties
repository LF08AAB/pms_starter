spring.application.name=pms

# --- Datenbank: PostgreSQL im Docker-Container (siehe compose.yml, Service postgres-pms) ---
spring.datasource.url=jdbc:postgresql://localhost:15432/pms_db
spring.datasource.username=pms
spring.datasource.password=secret

server.port=8080

# --- Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Fehlerantworten ---
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# --- Authentik: zentraler Identity-Provider, läuft lokal über compose.yml ---
authentik.jwk-set-uri=http://localhost:9000/application/o/employee_api/jwks/
authentik.issuer-uri=http://localhost:9000/application/o/employee_api/

# --- Andere Backoffice-Microservices ---
employee-service.base-url=http://localhost:8089

# --- Swagger ---
springdoc.swagger-ui.path=swagger
springdoc.swagger-ui.try-it-out-enabled=true
