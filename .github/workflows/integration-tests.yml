
name: S02 Integration Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run S02 and S10 integration tests
        run: ./mvnw -Dtest=ProjectControllerIntegrationTest,ProjectDeleteIntegrationTest test
